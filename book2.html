  <style>
    .coming-soon-page {
      position: relative; z-index: 1;
      min-height: calc(100dvh - 65px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .cs-ornament {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      color: var(--gold);
      margin-bottom: 1rem;
      animation: springIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .cs-eyebrow {
      display: inline-block;
      font-family: 'Nunito', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brand);
      background: var(--surface-tint);
      border: 1.5px solid rgba(124, 92, 252, 0.2);
      border-radius: var(--radius-full);
      padding: 4px 14px;
      margin-bottom: 1rem;
      animation: fadeDown 0.5s ease 0.1s both;
    }

    .cs-title {
      font-family: 'Amiri', serif;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 0.3rem;
      animation: fadeDown 0.5s ease 0.15s both;
    }

    .cs-subtitle {
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2rem;
      animation: fadeDown 0.5s ease 0.2s both;
    }

    .cs-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-faint);
      border: 1.5px solid var(--gold-border);
      border-radius: var(--radius-full);
      padding: 0.45rem 1.2rem;
      margin-bottom: 1.5rem;
      animation: fadeIn 0.5s ease 0.3s both;
    }

    .cs-desc {
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-mid);
      max-width: 400px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      animation: fadeIn 0.5s ease 0.35s both;
    }

    .cs-back {
      font-family: 'Nunito', sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--brand);
      border-radius: var(--radius-full);
      padding: 0.8rem 2rem;
      text-decoration: none;
      box-shadow: 0 5px 0 var(--brand-dark), 0 8px 24px var(--brand-glow);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: springIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
    }
    .cs-back:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 var(--brand-dark), 0 12px 28px var(--brand-glow);
    }
    .cs-back:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--brand-dark);
    }

    @media (max-width: 480px) {
      .coming-soon-page { padding: 2rem 1rem; }
      .cs-back { width: 100%; max-width: 320px; text-align: center; }
    }
