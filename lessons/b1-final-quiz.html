  <link rel="stylesheet" href="../assets/css/shared.css" />
  <style>
    .final-placeholder {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 4rem 1.2rem;
      min-height: calc(100vh - 84px);
      display: grid;
      place-items: center;
    }

    .final-placeholder-panel {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid var(--gold-border);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
    }

    .final-placeholder-ornament {
      font-family: 'Amiri', serif;
      font-size: 1.55rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    .final-placeholder-label {
      font-family: 'Lato', sans-serif;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.8rem;
    }

    .final-placeholder-title {
      font-family: 'Amiri', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
      margin-bottom: 0.8rem;
    }

    .final-placeholder-copy {
      max-width: 520px;
      margin: 0 auto 1.4rem;
      font-family: 'Lato', sans-serif;
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--text-mid);
    }

    .final-placeholder-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .final-placeholder-btn {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      border: 1.5px solid var(--gold-border);
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--gold);
      background: transparent;
    }

    .final-placeholder-btn-primary {
      color: #fff;
      background: var(--gold);
      border-color: var(--gold);
    }

    @media (max-width: 480px) {
      .final-placeholder {
        min-height: calc(100vh - 58px);
        padding: 1.5rem 0.8rem 3rem;
      }

      .final-placeholder-panel {
        padding: 1.25rem 0.9rem;
        border-radius: 10px;
      }

      .final-placeholder-title {
        font-size: 1.55rem;
      }

      .final-placeholder-copy {
        font-size: 0.82rem;
        line-height: 1.5;
      }

      .final-placeholder-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <svg class="geo-bg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <pattern id="geo" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
        <polygon points="40,5 75,22 75,57 40,74 5,57 5,22" fill="none" stroke="#9B8ABF" stroke-width="1"/>
        <polygon points="40,18 62,29 62,51 40,62 18,51 18,29" fill="none" stroke="#9B8ABF" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="800" height="600" fill="url(#geo)"/>
  </svg>

  <main class="final-placeholder">
    <section class="final-placeholder-panel" aria-labelledby="final-placeholder-title">
      <div class="final-placeholder-ornament">✦ الاِمْتِحَان ✦</div>
      <div class="final-placeholder-label">Coming Soon</div>
      <h1 class="final-placeholder-title" id="final-placeholder-title">Book 1 Final Quiz</h1>
      <p class="final-placeholder-copy">
        The final assessment will be built after the remaining Book 1 lessons are complete, so it can test the full curriculum fairly.
      </p>
      <div class="final-placeholder-actions">
        <a class="final-placeholder-btn final-placeholder-btn-primary" href="../book1.html">Back to Book 1</a>
        <a class="final-placeholder-btn" href="../index.html">Home</a>
      </div>
    </section>
  </main>
</body>
</html>
