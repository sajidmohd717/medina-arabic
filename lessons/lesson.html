<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson — Kalamo</title>
  <meta name="description" content="Interactive Arabic lesson — vocabulary, grammar, reading comprehension, practice exercises, and a graded quiz. Based on the Madinah Arabic Course." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kalamo" />
  <meta property="og:title" content="Lesson — Kalamo" />
  <meta property="og:description" content="Interactive Arabic lesson — vocabulary, grammar, reading comprehension, practice, and quiz. Free on Kalamo." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Lesson — Kalamo" />
  <meta name="twitter:description" content="Interactive Arabic lesson — vocabulary, grammar, reading comprehension, practice, and quiz. Free on Kalamo." />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#7C5CFC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js');</script>
  <link rel="stylesheet" href="../assets/css/shared.css?v=purple-1" />
  <link rel="stylesheet" href="../assets/css/lesson.css?v=purple-1" />
</head>
<body>

  <!-- Geo background -->
  <svg class="geo-bg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <pattern id="geo" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
        <polygon points="40,5 75,22 75,57 40,74 5,57 5,22" fill="none" stroke="#9B8ABF" stroke-width="1"/>
        <polygon points="40,18 62,29 62,51 40,62 18,51 18,29" fill="none" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="40" y1="5"  x2="40" y2="18" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="75" y1="22" x2="62" y2="29" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="75" y1="57" x2="62" y2="51" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="40" y1="74" x2="40" y2="62" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="5"  y1="57" x2="18" y2="51" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="5"  y1="22" x2="18" y2="29" stroke="#9B8ABF" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="800" height="600" fill="url(#geo)"/>
  </svg>

  <!-- Home pill -->
  <a class="lesson-home-btn" href="../index.html" aria-label="Back to Home">← Home</a>

  <section class="lesson-intro" id="lessonIntro" aria-labelledby="lessonIntroTitle">
    <div class="lesson-intro-card">
      <div class="lesson-intro-glow" aria-hidden="true"></div>
      <div class="lesson-intro-mark" aria-hidden="true">هٰذَا</div>
      <div class="lesson-intro-eyebrow" id="lessonIntroEyebrow"></div>
      <h1 class="lesson-intro-title" id="lessonIntroTitle"></h1>
      <div class="lesson-intro-english" id="lessonIntroEnglish"></div>
      <p class="lesson-intro-summary" id="lessonIntroSummary"></p>
      <div class="lesson-intro-path" aria-label="Lesson path">
        <span>Learn</span>
        <span>Read</span>
        <span>Practice</span>
        <span>Quiz</span>
      </div>
      <p class="lesson-intro-hint">💡 Tap any Arabic word to see its meaning</p>
      <button class="btn btn-primary lesson-intro-btn" id="lessonIntroContinue" type="button">Continue</button>
    </div>
  </section>

  <div class="lesson-page is-waiting" id="lessonPage">

    <!-- Step indicator -->
    <div class="step-indicator">
      <button class="step-btn active" id="step-vocab" onclick="goToStep('vocab')">
        <div class="step-icon">📖</div>
        <span class="step-label">Vocabulary</span>
      </button>
      <button class="step-btn locked" id="step-lesson" onclick="goToStep('lesson')">
        <div class="step-icon">🧠</div>
        <span class="step-label">Concepts</span>
      </button>
      <button class="step-btn locked" id="step-comprehension" onclick="goToStep('comprehension')">
        <div class="step-icon">📖</div>
        <span class="step-label">Reading</span>
      </button>
      <button class="step-btn locked" id="step-practice" onclick="goToStep('practice')">
        <div class="step-icon">⚡</div>
        <span class="step-label">Practice</span>
      </button>
      <button class="step-btn locked" id="step-quiz" onclick="goToStep('quiz')">
        <div class="step-icon">🎯</div>
        <span class="step-label">Quiz</span>
      </button>
    </div>

    <!-- PANEL 1 — VOCABULARY -->
    <div class="lesson-panel active" id="panel-vocab">
      <div class="guided-page-progress" id="guidedPageProgress" style="display:none">
        <div class="guided-page-progress-bar">
          <div class="guided-page-progress-fill" id="guidedProgressFill"></div>
          <div class="guided-milestone-marker" id="guidedMilestoneMarker"></div>
          <div class="guided-milestone-marker guided-milestone-marker--end" id="guidedMilestoneMarkerEnd"></div>
        </div>
        <span class="guided-page-progress-label" id="guidedProgressLabel"></span>
      </div>
      <div class="vocab-grid"></div>
      <div class="panel-nav">
        <a class="btn btn-secondary" id="panelVocabBackLink" href="../book1.html">← Back to Book</a>
        <button class="btn btn-primary" onclick="unlockAndGo('lesson')">Next: Questions →</button>
      </div>
    </div>

    <!-- PANEL 2 — LESSON CONTENT -->
    <div class="lesson-panel" id="panel-lesson">
      <div class="lesson-content-inner"></div>
      <div class="panel-nav">
        <button class="btn btn-secondary" onclick="goToStep('vocab')">← Learn</button>
        <button class="btn btn-primary" onclick="unlockAndGo('comprehension')">I understand — Next: Reading →</button>
      </div>
    </div>

    <!-- PANEL 2.5 — COMPREHENSION -->
    <div class="lesson-panel" id="panel-comprehension">
      <div class="comprehension-content"></div>
      <div class="panel-nav">
        <button class="btn btn-secondary" onclick="goToStep('vocab')">← Learn</button>
        <button class="btn btn-primary" onclick="unlockAndGo('quiz')">Finished — Next: Quiz →</button>
      </div>
    </div>

    <!-- PANEL 3 — PRACTICE -->
    <div class="lesson-panel" id="panel-practice">
      <div class="practice-container"></div>
      <div class="panel-nav">
        <button class="btn btn-secondary" onclick="goToStep('comprehension')">← Reading</button>
        <button class="btn btn-primary" onclick="unlockAndGo('quiz')">Ready — Take the Quiz →</button>
      </div>
    </div>

    <!-- PANEL 4 — QUIZ -->
    <div class="lesson-panel" id="panel-quiz">
      <p class="quiz-total-label" id="quizTotalLabel"></p>
      <div class="quiz-container"></div>

      <!-- On-screen Arabic keyboard -->
      <div class="arabic-keyboard">
        <div class="keyboard-title">Arabic keyboard — click a letter to type it into the active input</div>
        <div class="keyboard-row">
          <button class="key" onclick="typeKey('ض')">ض</button>
          <button class="key" onclick="typeKey('ص')">ص</button>
          <button class="key" onclick="typeKey('ث')">ث</button>
          <button class="key" onclick="typeKey('ق')">ق</button>
          <button class="key" onclick="typeKey('ف')">ف</button>
          <button class="key" onclick="typeKey('غ')">غ</button>
          <button class="key" onclick="typeKey('ع')">ع</button>
          <button class="key" onclick="typeKey('ه')">ه</button>
          <button class="key" onclick="typeKey('خ')">خ</button>
          <button class="key" onclick="typeKey('ح')">ح</button>
          <button class="key" onclick="typeKey('ج')">ج</button>
        </div>
        <div class="keyboard-row">
          <button class="key" onclick="typeKey('ش')">ش</button>
          <button class="key" onclick="typeKey('س')">س</button>
          <button class="key" onclick="typeKey('ي')">ي</button>
          <button class="key" onclick="typeKey('ب')">ب</button>
          <button class="key" onclick="typeKey('ل')">ل</button>
          <button class="key" onclick="typeKey('ا')">ا</button>
          <button class="key" onclick="typeKey('ت')">ت</button>
          <button class="key" onclick="typeKey('ن')">ن</button>
          <button class="key" onclick="typeKey('م')">م</button>
          <button class="key" onclick="typeKey('ك')">ك</button>
          <button class="key" onclick="typeKey('د')">د</button>
        </div>
        <div class="keyboard-row">
          <button class="key" onclick="typeKey('ئ')">ئ</button>
          <button class="key" onclick="typeKey('ء')">ء</button>
          <button class="key" onclick="typeKey('ؤ')">ؤ</button>
          <button class="key" onclick="typeKey('ر')">ر</button>
          <button class="key" onclick="typeKey('ى')">ى</button>
          <button class="key" onclick="typeKey('ة')">ة</button>
          <button class="key" onclick="typeKey('و')">و</button>
          <button class="key" onclick="typeKey('ز')">ز</button>
          <button class="key" onclick="typeKey('ظ')">ظ</button>
          <button class="key" onclick="typeKey('ذ')">ذ</button>
        </div>
        <div class="keyboard-row">
          <button class="key" onclick="typeKey('َ')" title="Fatha (a)">فَ</button>
          <button class="key" onclick="typeKey('ِ')" title="Kasra (i)">فِ</button>
          <button class="key" onclick="typeKey('ُ')" title="Damma (u)">فُ</button>
          <button class="key" onclick="typeKey('ً')" title="Tanwin fath">فً</button>
          <button class="key" onclick="typeKey('ٌ')" title="Tanwin damm">فٌ</button>
          <button class="key" onclick="typeKey('ٍ')" title="Tanwin kasr">فٍ</button>
          <button class="key" onclick="typeKey('ّ')" title="Shadda">فّ</button>
          <button class="key" onclick="typeKey('ْ')" title="Sukun">فْ</button>
          <button class="key key-wide key-backspace" onclick="deleteKey()">⌫ Del</button>
          <button class="key key-wide key-clear" onclick="clearInput()">Clear</button>
        </div>
      </div>

      <!-- Submit + score -->
      <div class="panel-nav">
        <button class="btn btn-secondary" onclick="goToStep('comprehension')">← Reading</button>
        <button class="btn btn-primary" id="submitQuizBtn" onclick="submitQuiz()">Submit Quiz →</button>
      </div>

      <!-- Score card (hidden until submit) -->
      <div class="quiz-score-card" id="scoreCard" style="display:none;">
        <div class="quiz-score-arabic">✦ النَّتِيجَة ✦</div>
        <div class="quiz-score-title">Your Score</div>
        <div class="quiz-score-number" id="scoreNumber">0/0</div>
        <div class="quiz-score-label" id="scoreLabel"></div>
        <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1rem;">
          <button class="btn btn-secondary" onclick="retryQuiz()">Try Again</button>
          <a class="btn btn-success" id="nextLessonBtn" href="#">Next Lesson →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/progress.js"></script>
  <script src="../assets/js/gamification.js"></script>
  <script src="../assets/js/bottom-nav.js"></script>
  <script src="../assets/js/lesson-core.js"></script>
  <!-- Data file will be injected here by lesson-loader.js -->
  <script src="../assets/js/lesson-loader.js"></script>

</body>
</html>
