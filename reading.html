<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Track - Kalamo</title>
  <meta name="description" content="Build Arabic reading fluency with Kalamo's simple leveled reading stories and comprehension checks." />
  <link rel="canonical" href="https://sajidmohd717.github.io/medina-arabic/reading.html" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kalamo" />
  <meta property="og:url" content="https://sajidmohd717.github.io/medina-arabic/reading.html" />
  <meta property="og:title" content="Reading Track - Kalamo" />
  <meta property="og:description" content="Practice Arabic reading with one leveled story at a time." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Reading Track - Kalamo" />
  <meta name="twitter:description" content="Practice Arabic reading with one leveled story at a time." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7C5CFC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script>
  <link rel="stylesheet" href="assets/css/shared.css?v=purple-1" />
  <link rel="stylesheet" href="assets/css/mobile.css?v=purple-1" />
  <link rel="stylesheet" href="assets/css/reading.css?v=purple-1" />
</head>
<body>

  <svg class="geo-bg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <pattern id="geo" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
        <polygon points="40,5 75,22 75,57 40,74 5,57 5,22" fill="none" stroke="#9B8ABF" stroke-width="1"/>
        <polygon points="40,18 62,29 62,51 40,62 18,51 18,29" fill="none" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="40" y1="5" x2="40" y2="18" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="75" y1="22" x2="62" y2="29" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="75" y1="57" x2="62" y2="51" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="40" y1="74" x2="40" y2="62" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="5" y1="57" x2="18" y2="51" stroke="#9B8ABF" stroke-width="0.5"/>
        <line x1="5" y1="22" x2="18" y2="29" stroke="#9B8ABF" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="800" height="600" fill="url(#geo)"/>
  </svg>

  <main class="reading-page">
    <section class="reading-intro" aria-label="Reading practice overview">
      <p>Reading short Arabic passages helps you recognize familiar words faster and build smoother reading speed.</p>
      <button class="reading-progress-btn" type="button" onclick="toggleReadingOverview()">View Progress</button>
    </section>

    <section class="reading-overview" id="readingOverview" aria-label="Reading progress overview">
      <div class="overview-stat">
        <strong id="overviewStories">0</strong>
        <span>Stories passed</span>
      </div>
      <div class="overview-stat">
        <strong id="overviewLevel">Pre-Level One</strong>
        <span>Current level</span>
      </div>
      <div class="overview-stat">
        <strong id="overviewWords">0</strong>
        <span>Words unlocked</span>
      </div>
      <div class="overview-progress">
        <div class="overview-progress-head">
          <span id="overviewNextHint">Pass 5 stories to reach Level One.</span>
          <strong id="overviewProgressText">0 / 5</strong>
        </div>
        <div class="overview-track" aria-hidden="true">
          <div class="overview-fill" id="overviewProgressFill"></div>
        </div>
      </div>
    </section>

    <section class="daily-reader" id="readerCard" aria-live="polite"></section>
  </main>

  <script src="assets/js/progress.js"></script>
  <script src="assets/js/gamification.js"></script>
  <script src="assets/js/bottom-nav.js"></script>
  <script src="assets/js/reading.js"></script>
</body>
</html>
